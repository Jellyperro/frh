<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>929 傅若涵</title>
    <style>
        h3{
            color: red;
        }
        p{
            color: blue;
        }
        /* 标签选择器，选择器名称为标签 */
        #box{
            width: 500px;
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器，选择器名称为id,以#开始，唯一*/
        .n1{
            color: #7A9;
        }
        .n2{
            color: #311099;
        }
        .n3{
            color: #551699;
        }
        /*class选择器器，选择器名称为class，以.开始，可以重复使用*/

        /* 扩展1：h2黑底白字 */
        h2{
            background-color: black;
            color: white;
        }
        /* 扩展3：选择器这三个字是白色 */
        .sel{
            color: white;
        }
        /* 扩展4：新加一个盒子，盒子里的文字是学号929 */
        #box2{
            width: 200px;
            height: 100px;
            background-color: #333;
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <h2>层叠样式表</h2>
    <div id="box">
        <h3>CSS<span class="sel">选择器</span></h3>
        <p><span class="n1">傅</span><span class="n2">若</span><span class="n3">涵</span></p>
        <p>CSS属性</p>
    </div>
    <!-- 1.h2黑底白字，2.名字每个字不同颜色在同一行，目前已经有一个字，我的名字是傅若涵3.选择器这三个字是白色，4.新加一个盒子，盒子里的文字是我的学号929 -->
    <!-- 新加的盒子：学号929 -->
    <div id="box2">929</div>
</body>
</html>
