<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       h2,h3,p{
        padding:0;
        margin:0;
       } /* 群组选择器 */
       #box{
        padding:8px;
        margin:20px;
        border:1px solid #ccc;
        font-size:12px;
        width:400px;
       }
       #box h3{
        /* 字体大小16px */
        font-size:16px;
        /* 行高33px */
        line-height:33px;
        /* 居中 */
        text-align:center;
        /* 颜色#034 */
        color:#034;
        /* 字间距 */
        letter-spacing:3px;
       }
       #box>p{
        /* 颜色#666 */
        color:#666;
        /* 首行空2格 */
        text-indent:2em;
        /* 行高150% */
        line-height:150%;
       }
       #box a{
        /* 颜色#f11 */
        color:#f11;
        /* 下划线 */
        text-decoration:none;
       }
       /* 扩展1：学号、姓名、班级的值蓝色加粗，用类选择器 .val 统一控制 */
       .val{
        color:blue;
        font-weight:bold;
       }
       /* 扩展2：h2黑底白字 */
       h2{
        background-color:black;
        color:white;
        text-align:center;
       }
       /* 扩展3：知识点的值蓝底白字 */
       .kw{
        background-color:blue;
        color:white;
       }
    </style>
</head>
<body>
    <h2>css群组选择器和后代选择器</h2>
    <div id="box">
        <h3>CSS进阶</h3>
        <p>学号:<span class="val">929</span>,姓名:<span class="val">傅若涵</span>,班级:<span class="val">计算机24009</span>,《高级网页设计》设计的学习难度:中等
            本实例的知识点:<span class="kw">CSS群组选择器和后代选择器</span>。
            <a href="#">【更多】</a>
        </p>
    </div>
    <!-- 扩展：
     1.学号姓名班级的值是蓝色加粗，使用1个css选择器
     2.h2黑底白字
     3.知识点的值蓝底白字
    -->
</body>
</html>
