<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>13-4 SVG Symbol · 移动端固定下导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
            background: #e9efec;
            color: #222;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* 手机外壳：桌面端居中，移动端铺满 */
        .Fu_phone {
            position: relative;
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: #f5f8f6;
            display: flex;
            flex-direction: column;
        }

        /* 顶部应用栏 */
        .Fu_header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #ffffff;
            border-bottom: 1px solid #ececec;
        }

        .Fu_header-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .Fu_header-tag {
            font-size: 11px;
            letter-spacing: 1px;
            color: #1a7a4c;
            background: #e6f2ec;
            padding: 3px 9px;
            border-radius: 10px;
        }

        /* 内容区 —— 底部留出足够空间给凸起的导航 */
        .Fu_content {
            flex: 1;
            overflow-y: auto;
            padding: 14px 14px 130px;
        }

        .Fu_banner {
            border-radius: 12px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a7a4c, #3aa06d);
            color: #fff;
            padding: 22px 18px;
        }

        .Fu_banner h2 {
            font-size: 20px;
            letter-spacing: 2px;
        }

        .Fu_banner p {
            margin-top: 6px;
            font-size: 12.5px;
            opacity: .88;
            line-height: 1.7;
        }

        .Fu_section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin: 22px 2px 10px;
        }

        .Fu_section-title h3 {
            font-size: 15px;
            font-weight: 600;
        }

        .Fu_section-title span {
            font-size: 12px;
            color: #1a7a4c;
        }

        .Fu_card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .Fu_card {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .03);
        }

        .Fu_card-thumb {
            flex: 0 0 64px;
            width: 64px;
            height: 64px;
            border-radius: 10px;
            background: linear-gradient(135deg, #cfe6da, #a9d2bd);
        }

        .Fu_card-body {
            flex: 1;
            min-width: 0;
        }

        .Fu_card-body h4 {
            font-size: 14px;
            font-weight: 600;
            color: #2b332e;
        }

        .Fu_card-body p {
            margin-top: 4px;
            font-size: 12px;
            color: #8a938d;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* =====================================================
           固定下导航 —— 仿 INaturalist 风格（SVG 版本）
           4 项等分布局，中间凸起圆形上传按钮
           ===================================================== */
        .Fu_tabbar {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            display: flex;
            align-items: flex-end;
            background: #ffffff;
            border-top: 1px solid #ececec;
            box-shadow: 0 -2px 14px rgba(0, 0, 0, .05);
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 100;
        }

        /* 5 个等份：2 tab + 1 中间占位 + 2 tab */
        .Fu_tab,
        .Fu_upload-wrap {
            flex: 1 1 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 普通 tab 样式 */
        .Fu_tab {
            gap: 3px;
            padding: 10px 0 12px;
            font-size: 11px;
            color: #8a938d;
            transition: color .2s ease;
        }

        .Fu_iconWrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .Fu_svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            overflow: hidden;
        }

        .Fu_upload .Fu_svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .Fu_tab.Fu_active {
            color: #1a7a4c;
        }

        /* 中间占位（让两侧 tab 等分）—— 添加 min-height 防止高度塌陷 */
        .Fu_upload-wrap {
            position: relative;
            min-height: 50px;
            padding-top: 0;
        }

        /* 凸起的圆形上传按钮 */
        .Fu_upload {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -70%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #1a7a4c;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(26, 122, 76, .4);
            transition: transform .2s ease, box-shadow .2s ease;
            z-index: 101;
        }

        .Fu_upload:active {
            transform: translate(-50%, -70%) scale(.92);
            box-shadow: 0 2px 8px rgba(26, 122, 76, .3);
        }

        /* 上传按钮下方占位文字（模仿 INaturalist）*/
        .Fu_upload-label {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #8a938d;
            white-space: nowrap;
        }

        /* 右上角红点 */
        .Fu_dot {
            position: absolute;
            top: -4px;
            right: -8px;
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border: 1.5px solid #fff;
            border-radius: 50%;
        }

        /* 右上角数字徽章 */
        .Fu_badge {
            position: absolute;
            top: -7px;
            right: -16px;
            min-width: 18px;
            height: 16px;
            padding: 0 5px;
            background: #ff3b30;
            color: #fff;
            font-size: 10px;
            font-style: normal;
            font-weight: 500;
            line-height: 16px;
            text-align: center;
            border: 1.5px solid #fff;
            border-radius: 9px;
            box-shadow: 0 1px 2px rgba(255, 59, 48, .3);
        }

        /* 上传按钮的红点（如果需要）*/
        .Fu_upload .Fu_dot {
            top: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
        }

        @media (max-width: 430px) {
            .Fu_phone {
                max-width: 100%;
            }
            .Fu_tabbar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="Fu_phone">
        <header class="Fu_header">
            <span class="Fu_header-title">户外自然生态科普</span>
            <span class="Fu_header-tag">NATURE</span>
        </header>

        <main class="Fu_content">
            <section class="Fu_banner">
                <h2>走进自然的课堂</h2>
                <p>森林 · 湿地 · 溪流 · 冰川，记录每一次与生态的相遇。</p>
            </section>

            <div class="Fu_section-title">
                <h3>今日推荐</h3>
                <span>更多 &gt;</span>
            </div>

            <div class="Fu_card-list">
                <a class="Fu_card" href="#">
                    <span class="Fu_card-thumb"></span>
                    <div class="Fu_card-body">
                        <h4>高原湿地的清晨</h4>
                        <p>芦苇丛中的涉禽陆续起飞，湿地是候鸟迁徙通道上重要的停歇地。</p>
                    </div>
                </a>
                <a class="Fu_card" href="#">
                    <span class="Fu_card-thumb"></span>
                    <div class="Fu_card-body">
                        <h4>原始森林的光</h4>
                        <p>林下的苔藓与蕨类，在斑驳的光影里进行着安静的光竞争。</p>
                    </div>
                </a>
                <a class="Fu_card" href="#">
                    <span class="Fu_card-thumb"></span>
                    <div class="Fu_card-body">
                        <h4>冰川消退之后</h4>
                        <p>正在融化的固体水库，塑造着高山峡谷与冰碛湖的独特地貌。</p>
                    </div>
                </a>
                <a class="Fu_card" href="#">
                    <span class="Fu_card-thumb"></span>
                    <div class="Fu_card-body">
                        <h4>海岸带的风</h4>
                        <p>潮汐、盐沼、红树林——海陆之间最富生产力的生态交错带。</p>
                    </div>
                </a>
            </div>
        </main>

        <!-- 仿 INaturalist 下导航：4 项 + 中间凸起加号 -->
        <nav class="Fu_tabbar">
            <a class="Fu_tab Fu_active" href="#">
                <span class="Fu_iconWrap">
                    <svg class="Fu_svg" aria-hidden="true"><use href="#icon-shouye"></use></svg>
                </span>
                <span>选单</span>
            </a>
            <a class="Fu_tab" href="#">
                <span class="Fu_iconWrap">
                    <svg class="Fu_svg" aria-hidden="true"><use href="#icon-faxian"></use></svg>
                    <i class="Fu_badge">99+</i>
                </span>
                <span>探索</span>
            </a>

            <!-- 中间凸起上传按钮占位 -->
            <div class="Fu_upload-wrap">
                <a class="Fu_upload" href="#" aria-label="上传观察">
                    <svg class="Fu_svg" aria-hidden="true"><use href="#icon-xinzeng"></use></svg>
                    <i class="Fu_dot"></i>
                </a>
                <span class="Fu_upload-label">上传</span>
            </div>

            <a class="Fu_tab" href="#">
                <span class="Fu_iconWrap">
                    <svg class="Fu_svg" aria-hidden="true"><use href="#icon-wode"></use></svg>
                    <i class="Fu_dot"></i>
                </span>
                <span>我的</span>
            </a>
            <a class="Fu_tab" href="#">
                <span class="Fu_iconWrap">
                    <svg class="Fu_svg" aria-hidden="true"><use href="#icon-langdu"></use></svg>
                    <i class="Fu_badge">3</i>
                </span>
                <span>动态</span>
            </a>
        </nav>
    </div>

    <!-- 内联 SVG Symbol 集合（来自 font/iconfont.js，避免 file:// 跨域引用外部脚本） -->

        <symbol id="icon-faxian" viewBox="0 0 1024 1024"><path d="M512 85.333333c235.637333 0 426.666667 191.029333 426.666667 426.666667S747.637333 938.666667 512 938.666667 85.333333 747.637333 85.333333 512 276.362667 85.333333 512 85.333333z m0 64c-200.298667 0-362.666667 162.368-362.666667 362.666667s162.368 362.666667 362.666667 362.666667 362.666667-162.368 362.666667-362.666667-162.368-362.666667-362.666667-362.666667z m149.162667 158.901334a42.666667 42.666667 0 0 1 54.602666 54.602666L637.642667 579.84a96 96 0 0 1-57.813334 57.802667l-216.992 78.122666a42.666667 42.666667 0 0 1-54.602666-54.602666l78.122666-217.002667a96 96 0 0 1 57.813334-57.802667z m-20.970667 75.573333l-174.346667 62.762667a32 32 0 0 0-19.274666 19.274666l-62.762667 174.346667 174.346667-62.762667a32 32 0 0 0 19.274666-19.274666l62.762667-174.346667z"></path></symbol>
        <!-- 新增（中间加号上传按钮）-->
        <symbol id="icon-xinzeng" viewBox="0 0 1024 1024"><path d="M921.6 458.752h-357.888V100.864c0-27.648-22.016-49.664-49.664-49.664s-49.664 22.016-49.664 49.664v357.888H106.496c-27.648 0-49.664 22.016-49.664 49.664s22.016 49.664 49.664 49.664h357.888v358.4c0 27.648 22.016 49.664 49.664 49.664s49.664-22.016 49.664-49.664v-358.4H921.6c27.648 0 49.664-22.016 49.664-49.664s-22.016-49.664-49.664-49.664z"></path></symbol>

    </svg>

    <script>
        (function () {
            var Fu_tabs = document.querySelectorAll(".Fu_tab");
            Fu_tabs.forEach(function (Fu_tab) {
                Fu_tab.addEventListener("click", function (Fu_event) {
                    Fu_event.preventDefault();
                    Fu_tabs.forEach(function (Fu_item) {
                        Fu_item.classList.remove("Fu_active");
                    });
                    Fu_tab.classList.add("Fu_active");
                });
            });

            // 中间上传按钮交互
            var Fu_upload = document.querySelector(".Fu_upload");
            if (Fu_upload) {
                Fu_upload.addEventListener("click", function (Fu_event) {
                    Fu_event.preventDefault();
                    Fu_upload.style.transform = "translate(-50%, -70%) scale(.9)";
                    setTimeout(function () {
                        Fu_upload.style.transform = "";
                    }, 150);
                });
            }
        })();
    </script>
</body>
</html>
