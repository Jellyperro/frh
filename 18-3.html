    <script>
        const Fu_svg = document.getElementById("Fu_arch");

        document.getElementById("Fu_btnDl").addEventListener("click", () => {
            const Fu_src = new XMLSerializer().serializeToString(Fu_svg);
            const Fu_blob = new Blob([Fu_src], { type: "image/svg+xml;charset=utf-8" });
            const Fu_url = URL.createObjectURL(Fu_blob);
            const Fu_a = document.createElement("a");
            Fu_a.href = Fu_url;
            Fu_a.download = "知识库智能客服系统架构_傅若涵.svg";
            Fu_a.click();
            URL.revokeObjectURL(Fu_url);
        });

        document.getElementById("Fu_btnPng").addEventListener("click", () => {
            const Fu_src = new XMLSerializer().serializeToString(Fu_svg);
            const Fu_blob = new Blob([Fu_src], { type: "image/svg+xml;charset=utf-8" });
            const Fu_url = URL.createObjectURL(Fu_blob);
            const Fu_img = new Image();
            Fu_img.onload = () => {
                const Fu_c = document.createElement("canvas");
                Fu_c.width = 2560; Fu_c.height = 1800;
                const Fu_ct = Fu_c.getContext("2d");
                Fu_ct.fillStyle = "#ffffff";
                Fu_ct.fillRect(0, 0, Fu_c.width, Fu_c.height);
                Fu_ct.drawImage(Fu_img, 0, 0, Fu_c.width, Fu_c.height);
                Fu_c.toBlob((b) => {
                    const Fu_a = document.createElement("a");
                    Fu_a.href = URL.createObjectURL(b);
                    Fu_a.download = "知识库智能客服系统架构_傅若涵.png";
                    Fu_a.click();
                });
                URL.revokeObjectURL(Fu_url);
            };
            Fu_img.src = Fu_url;
        });
    </script>
