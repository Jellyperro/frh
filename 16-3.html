        .Fu_header {
            text-align: center;
            margin-bottom: 44px;

        .Fu_badge {

            font-size: 14px;
            color: #8a8a8a;
            letter-spacing: 2px;
        }

        .Fu_line {
            width: 56px;
            height: 1px;
            margin: 26px auto 0;
            background: #1a1a1a;
        }

        /* 模拟京东页面局部：左侧红色渐变边缘 + 白色分类卡片 */
        .Fu_page {
            position: relative;
            max-width: 420px;
            margin: 0 auto;
            padding-left: 14px;
            animation: Fu_fadeUp 0.8s ease both;
        }

        .Fu_page::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            border-radius: 8px 0 0 8px;
            background: linear-gradient(180deg, #ff6666, #e2231a);
        }

        .Fu_panel {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 26px 28px 24px;
        }

        .Fu_panel h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #111;
            margin-bottom: 18px;
        }

        .Fu_list {
            list-style: none;
        }

        .Fu_list li {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 9px 0;
            font-size: 14.5px;
            color: #333;
        }

        .Fu_list li .iconfont {
            font-size: 19px;
            color: #3a3a3a;
            flex: 0 0 auto;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .Fu_list li a {
            color: #333;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .Fu_list li a:hover {
            color: #e2231a;
        }

        .Fu_list li .Fu_sep {
            color: #999;
            margin: 0 6px;
        }

        .Fu_list li:hover .iconfont {
            color: #e2231a;
            transform: scale(1.12);
        }

        .Fu_back {
            display: inline-block;
            margin-top: 32px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #555;
            text-decoration: none;
            border-bottom: 1px solid #d8d8d8;
            padding-bottom: 2px;
            transition: color 0.25s ease, border-color 0.25s ease;
        }

        .Fu_back:hover {
            color: #000;
            border-color: #1a1a1a;
        }

        .Fu_footer {
            text-align: center;
            margin-top: 44px;
            padding-top: 24px;
            border-top: 1px solid #e8e8e8;
            font-size: 12px;
            letter-spacing: 2px;
            color: #a8a8a8;
        }

        @keyframes Fu_fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
