<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width:150px;
            height:150px;
            border:1px solid #ccc;
            margin:10px;
            display: flex;
            /* 水平垂直居中 */
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.5s;
            box-sizing: border-box; /* 盒子模型 */
        }
        .box:first-child:hover{
            background:red;
            color:white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%; /* 圆形 */
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow:10px 10px 10px #ccc; /* 阴影 */
        }
        .box:nth-child(4):hover{
            text-shadow:100px 10px 10px #ccc; /* 文字阴影 */
        }
        .box:nth-child(5):hover{
            /* 线性渐变 */
            background: linear-gradient(#000, #ccc, #fff);
        }
        .box:nth-child(5)+.box{
            background: radial-gradient(#fff,#ccc,#000)
        }
        /* 相邻兄弟选择器 
        +后面的一个兄弟
        ~后面的所有兄弟
        */
        
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
