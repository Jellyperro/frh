<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13-1 Font Awesome 字体图标</title>
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="cdn/all.min.css">
    <style>
        .Fu_iconContainer {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .Fu_iconItem {
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            min-width: 80px;
        }
        .Fu_iconItem i {
            font-size: 32px;
            color: #4a4a4a;
            margin-bottom: 8px;
            display: block;
        }
        .Fu_iconName {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="Fu_title">13-1 Font Awesome 字体图标</h1>
        <p>采用字体图标形式（通过 CDN 本地化文件：all.min.css + webfonts）</p>
        
        <h2 class="Fu_subtitle">实心图标</h2>
        <div class="Fu_iconContainer">
            <div class="Fu_iconItem">
                <i class="fas fa-home"></i>
                <div class="Fu_iconName">home</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fas fa-heart"></i>
                <div class="Fu_iconName">heart</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fas fa-star"></i>
                <div class="Fu_iconName">star</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fas fa-user"></i>
                <div class="Fu_iconName">user</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fas fa-search"></i>
                <div class="Fu_iconName">search</div>
            </div>
        </div>
        
        <h2 class="Fu_subtitle">品牌图标</h2>
        <div class="Fu_iconContainer">
            <div class="Fu_iconItem">
                <i class="fab fa-github"></i>
                <div class="Fu_iconName">github</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fab fa-html5"></i>
                <div class="Fu_iconName">html5</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fab fa-css3-alt"></i>
                <div class="Fu_iconName">css3</div>
            </div>
            <div class="Fu_iconItem">
                <i class="fab fa-js-square"></i>
                <div class="Fu_iconName">js</div>
            </div>
        </div>
        
        <h2 class="Fu_subtitle">常规图标</h2>
        <div class="Fu_iconContainer">
            <div class="Fu_iconItem">
                <i class="far fa-envelope"></i>
                <div class="Fu_iconName">envelope</div>
            </div>
            <div class="Fu_iconItem">
                <i class="far fa-heart"></i>
                <div class="Fu_iconName">heart</div>
            </div>
            <div class="Fu_iconItem">
                <i class="far fa-star"></i>
                <div class="Fu_iconName">star</div>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <a href="index.html">返回首页</a>
        </div>
    </div>
</body>
</html>
